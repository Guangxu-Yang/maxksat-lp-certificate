name: Verify certificate

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact certificate verifier
        run: python3 scripts/verify_certificate.py
      - name: Run examples
        run: python3 examples.py all
      - name: Run tests
        run: python3 -m unittest discover -s tests
