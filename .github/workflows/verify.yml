name: Verify certificate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_replay:
        description: Recompute the current certificate with exact rational arithmetic
        required: false
        default: false
        type: boolean

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check bundle integrity and archived exact-certificate semantics
        run: python3 -B examples.py verify

  full-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.full_replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independently replay the current exact certificate
        run: python3 -B examples.py replay --output-dir "${{ runner.temp }}/full-exact-replay"
      - name: Preserve replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-exact-replay
          path: ${{ runner.temp }}/full-exact-replay/FULL_EXACT_REPLAY.json
          if-no-files-found: warn
